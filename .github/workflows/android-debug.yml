name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/controle-0.13.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality checks
        run: |
          pnpm check
          pnpm test
          pnpm lint

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build standalone APK
        env:
          NODE_ENV: production
        working-directory: android
        run: ./gradlew :safe-accept:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK identity and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" >> apk-info.txt
          sha256sum "$APK" >> apk-info.txt
          cat apk-info.txt

      - name: Stage verified APK for delivery
        run: |
          mkdir apk-delivery
          cp android/app/build/outputs/apk/release/app-release.apk apk-delivery/Toalha-Vermelha-0.13.1-teste-controle.apk
          cp apk-info.txt apk-delivery/
          cd apk-delivery
          sha256sum Toalha-Vermelha-0.13.1-teste-controle.apk > apk.sha256

      - name: Make APK available as a downloadable artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Toalha-Vermelha-0.13.1-teste-controle
          path: apk-delivery/*
          retention-days: 3
          compression-level: 0

      - name: Transfer APK to isolated publisher
        uses: actions/cache/save@v4
        with:
          path: apk-delivery
          key: apk-delivery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: Publish verified APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout, dependency install or project code executes with this token.
      - name: Receive APK from this exact build
        uses: actions/cache/restore@v4
        with:
          path: apk-delivery
          key: apk-delivery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Verify transfer and publish release
        working-directory: apk-delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check apk.sha256
          if gh release view v0.13.1 >/dev/null 2>&1; then
            echo "Existing release preserved."
          else
            gh release create v0.13.1 Toalha-Vermelha-0.13.1-teste-controle.apk apk-info.txt apk.sha256 \
              --target "$GITHUB_SHA" --title "Toalha Vermelha 0.13.1 — Teste do comando do cartão" --prerelease \
              --notes "Teste experimental do ACTION_LONG_CLICK anunciado pelo cartão visível. Não usa gesto substituto nem rolagem nesse método. Inclui histórico de notificações e amostra preservada ao registrar observações. Inicia pausado na atualização; mantém Uma corrida, Corridas seguidas e Toque anterior. Aceite e comportamento do aviso ainda dependem de teste no Moto G84. APK ARM64 com testes e assinatura verificados."
          fi
