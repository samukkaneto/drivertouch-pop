name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality checks
        run: |
          pnpm check
          pnpm test
          pnpm lint

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build standalone APK
        env:
          NODE_ENV: production
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Toalha-Vermelha-0.9.0-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
