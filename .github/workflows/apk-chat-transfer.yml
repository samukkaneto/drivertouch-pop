name: Transfer existing APK to chat
on:
  push:
    branches:
      - codex/apk-transfer-0.10.0
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obtain short-lived URL for the requested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          from urllib.parse import urlparse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          req = urllib.request.Request(
              'https://api.github.com/repos/samukkaneto/drivertouch-pop/releases/assets/662196336',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/octet-stream',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              urllib.request.build_opener(NoRedirect()).open(req)
              raise RuntimeError('Expected a download redirect')
          except urllib.error.HTTPError as e:
              if e.code != 302:
                  raise RuntimeError('Unexpected status: ' + str(e.code))
              location = e.headers['Location']
              if urlparse(location).scheme != 'https' or urlparse(location).hostname != 'release-assets.githubusercontent.com':
                  raise RuntimeError('Unexpected download host')
              print('APK_DOWNLOAD_URL=' + location)
          PY
