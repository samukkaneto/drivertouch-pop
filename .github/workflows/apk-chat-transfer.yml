name: Transfer existing APK to chat
on:
  push:
    branches:
      - codex/apk-transfer-0.10.0
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the existing APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: samukkaneto/drivertouch-pop
        run: |
          gh release download v0.10.0 --pattern Toalha-Vermelha-0.10.0.apk
          echo '587dcf234c3f34b0b1608ec97ef52410c25f441abedea1634c7ecc157c45f097  Toalha-Vermelha-0.10.0.apk' | sha256sum --check -
      - name: Transfer APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toalha-Vermelha-0.10.0
          path: Toalha-Vermelha-0.10.0.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
